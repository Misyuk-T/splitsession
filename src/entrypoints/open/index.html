<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SplitSession: opening…</title>
    <link rel="stylesheet" href="../../ui/fonts.css" />
    <style>
      :root { color-scheme: light dark; --bg: #f7f7f8; --fg: #1d1d1f; --muted: #5f6368; --err: #b3261e; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1d; --fg: #ececf0; --muted: #a0a4ab; --err: #f2b8b5; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
      body { font: 16px/1.5 'Inter Variable', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-feature-settings: 'cv11', 'ss01'; letter-spacing: -0.006em; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
      main { max-width: 40rem; }
      p { margin: 0 0 .5rem; }
      .muted { color: var(--muted); font-size: 14px; word-break: break-all; }
      .error { color: var(--err); }
    </style>
  </head>
  <body>
    <main>
      <p id="status" role="status" aria-live="polite">Opening in container…</p>
      <p id="detail" class="muted"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
